apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbnb-backend
  namespace: airbnb-production
  labels:
    app: airbnb-backend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: airbnb-backend
  template:
    metadata:
      labels:
        app: airbnb-backend
    spec:
      containers:
      - name: backend
        image: airbnb/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: airbnb-secrets
              key: database-url
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

