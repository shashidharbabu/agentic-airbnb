apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-backend
  namespace: airbnb-system
  labels:
    app: host-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: host-backend
  template:
    metadata:
      labels:
        app: host-backend
    spec:
      containers:
      - name: host-backend
        image: 829108230080.dkr.ecr.us-east-1.amazonaws.com/airbnb/host-backend:latest
        imagePullPolicy: Always  # Pull from ECR
        ports:
        - containerPort: 4000
          name: http
        envFrom:
        - configMapRef:
            name: host-backend-config
        - secretRef:
            name: session-secrets
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5

