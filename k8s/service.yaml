apiVersion: v1
kind: Service
metadata:
  name: airbnb-backend-service
  namespace: airbnb-production
  labels:
    app: airbnb-backend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: airbnb-backend
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

